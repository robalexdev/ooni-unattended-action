name: ooni run
on:
  push:
  schedule:
    - cron: "19 23 3 * *"
jobs:

  unattended:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build
        run: docker build . -t ooniprobe
      - name: Run
        run: docker run ooniprobe run unattended && docker run ooniprobe list

