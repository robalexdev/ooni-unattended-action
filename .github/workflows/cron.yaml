name: ooni run
on: [push]

jobs:

  unattended:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build
        run: docker build . -t ooniprobe
      - name: Run MTA-STS checks
        run: docker run ooniprobe bash -c "ooniprobe run run websites --input-file mta-sts-list.txt && ooniprobe list"
      - name: Run
        run: docker run ooniprobe bash -c "ooniprobe run unattended && ooniprobe list"

